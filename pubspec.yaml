name: petal
description: "A clean, cross-platform media client built with Flutter — watch your favorite shows on Linux, Windows, Android, and iOS."
publish_to: 'none'

version: 0.3.1+31

environment:
  sdk: ^3.13.0

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Insight-Timer/media-kit.git
      ref: bb29cdf412a8f16b2b2198b07143990b42ae4db4
      path: media_kit
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  media_kit:
