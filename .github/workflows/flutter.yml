name: Flutter action

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: flutter pub run git_stamp --build-type full
      - run: flutter build apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: flutter pub run git_stamp --build-type full

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Debug certificate
        run: |
          echo "Base64 length: ${#BUILD_CERTIFICATE_BASE64}"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/test.p12
          ls -la /tmp/test.p12
          file /tmp/test.p12
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

      - name: Install certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
          echo "Profile UUID: $PROFILE_UUID"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug signing identities
        run: |
          echo "=== Available identities ==="
          security find-identity -v -p codesigning
          echo ""
          echo "=== Keychain list ==="
          security list-keychains
          echo ""
          echo "=== Provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: release-ios_ipa
          path: build/ios/ipa/*.ipa
          archive: false

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache: true

      - run: flutter pub run git_stamp --build-type full

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev

      - run: flutter build linux --release

      - name: Package release as Tarball
        run: |
          tar -czvf petal-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux-build
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: petal-linux-x64.tar.gz
          archive: false

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          pub-cache: true

      - run: flutter pub run git_stamp --build-type full
      - run: flutter build windows

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: release-exe
          path: build/windows/x64/runner/Release/blssmpetal.exe
          archive: false

  release:
    needs: [android-build, ios-build, linux-build, windows-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          skip-decompress: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            artifacts/release-apk/app-release.apk
            artifacts/release-ios_ipa/*.ipa
            artifacts/release-linux/petal-linux-x64.tar.gz
            artifacts/release-exe/blssmpetal.exe