name: Home loading checks
on:
  pull_request:
    paths:
      - 'lib/api/backend/cache_versions.dart'
      - 'lib/api/backend/backend_datasets.dart'
      - 'lib/api/cache/versioned_dataset.dart'
      - 'lib/api/backend/library_api.dart'
      - 'lib/api/user_library.dart'
      - 'test/versioned_dataset_checks.dart'
      - 'lib/utils/show_watch_plan.dart'
      - 'lib/api/history_actions.dart'
      - 'lib/api/show_watch_writer.dart'
      - 'lib/api/backend/backend_cache.dart'
      - 'lib/api/user_library.dart'
      - 'lib/widgets/overview/library_action_button.dart'
      - 'lib/widgets/overview/library_actions.dart'
      - 'lib/widgets/media/media_card.dart'
      - 'lib/pages/show_overview_page.dart'
      - 'test/show_watch_plan_checks.dart'
      - 'lib/pages/home_page.dart'
      - 'lib/api/upcoming_releases.dart'
      - 'lib/api/backend/backend_cache.dart'
      - 'lib/widgets/home/home_shelf_skeleton.dart'
      - 'lib/widgets/home/because_you_watched_shelf.dart'
      - 'lib/widgets/poster_shelf.dart'
      - 'lib/widgets/upcoming_episodes.dart'
      - 'lib/widgets/friend_activity.dart'
      - 'lib/widgets/downloads/downloads_shelf.dart'
      - '.github/workflows/home-loading-checks.yml'
permissions:
  contents: read
concurrency:
  group: home-loading-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: dart --enable-asserts --packages=.dart_tool/package_config.json test/versioned_dataset_checks.dart
      - run: dart --enable-asserts --packages=.dart_tool/package_config.json test/show_watch_plan_checks.dart
      - run: dart analyze lib/utils/show_watch_plan.dart lib/api/show_watch_writer.dart lib/api/history_actions.dart lib/widgets/overview/library_actions.dart lib/widgets/overview/library_action_button.dart lib/widgets/media/media_card.dart lib/pages/show_overview_page.dart lib/api/backend/cache_versions.dart lib/api/backend/backend_datasets.dart lib/api/cache/versioned_dataset.dart lib/api/backend/library_api.dart lib/api/user_library.dart lib/api/backend/backend_cache.dart lib/api/upcoming_releases.dart lib/pages/home_page.dart lib/widgets/home/home_shelf_skeleton.dart lib/widgets/home/because_you_watched_shelf.dart lib/widgets/poster_shelf.dart lib/widgets/upcoming_episodes.dart lib/widgets/friend_activity.dart lib/widgets/downloads/downloads_shelf.dart
