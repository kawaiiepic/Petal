name: Player style checks
on:
  pull_request:
    paths:
      - 'lib/pages/player/player_theme.dart'
      - 'lib/pages/player/stream_player.dart'
      - '.github/workflows/player-style-checks.yml'
permissions:
  contents: read
concurrency:
  group: player-style-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/pages/player/player_theme.dart lib/pages/player/stream_player.dart
