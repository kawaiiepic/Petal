name: Rewatch checks
on:
  pull_request:
    paths:
      - 'lib/utils/watch_counts.dart'
      - 'lib/widgets/overview/watch_activity_panel.dart'
      - 'lib/api/history_actions.dart'
      - 'lib/api/backend/backend_api.dart'
      - 'lib/api/offline_progress_sync.dart'
      - 'lib/pages/*overview_page.dart'
      - 'lib/pages/episode_detail_page.dart'
      - 'test/watch_counts_test.dart'
      - 'test/watch_counts_checks.dart'
      - '.github/workflows/rewatch-checks.yml'
concurrency:
  group: rewatch-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  counts-and-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: dart --enable-asserts --packages=.dart_tool/package_config.json test/watch_counts_checks.dart
      - run: dart analyze lib/api/backend/backend_api.dart lib/utils/watch_counts.dart lib/widgets/overview/watch_activity_panel.dart lib/api/history_actions.dart lib/api/offline_progress_sync.dart lib/pages/movie_overview_page.dart lib/pages/show_overview_page.dart lib/pages/episode_detail_page.dart
