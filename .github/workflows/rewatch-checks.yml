name: Rewatch checks
on:
  pull_request:
    paths:
      - 'lib/utils/watch_counts.dart'
      - 'lib/widgets/overview/watch_activity_panel.dart'
      - 'lib/api/history_actions.dart'
      - 'lib/api/offline_progress_sync.dart'
      - 'lib/pages/*overview_page.dart'
      - 'lib/pages/episode_detail_page.dart'
      - 'test/watch_counts_test.dart'
      - '.github/workflows/rewatch-checks.yml'
permissions:
  contents: read
jobs:
  counts-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config
      - run: flutter pub get
      - run: flutter test test/watch_counts_test.dart
      - run: dart analyze lib/utils/watch_counts.dart lib/widgets/overview/watch_activity_panel.dart lib/api/history_actions.dart lib/api/offline_progress_sync.dart lib/pages/movie_overview_page.dart lib/pages/show_overview_page.dart lib/pages/episode_detail_page.dart
